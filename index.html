<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsAggregator — Live Global Feed</title>
<style>
  :root{--bg:#0b0d12;--surface:#13141a;--card:#181b24;--text:#e6e8f0;--accent:#7289da;--muted:#8a92a3;--border:rgba(255,255,255,.08);--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:1.25rem 1.5rem;}
  .header-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
  header h1{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);}
  header .subtitle{color:var(--muted);font-size:.82rem;}
  .container{max-width:1040px;margin:0 auto;padding:1.5rem;}
  .toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
  .toolbar input{flex:1 1 260px;background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.6rem .9rem;font-size:.95rem;outline:none;transition:border-color .15s;}
  .toolbar input:focus{border-color:var(--accent);}
  .toolbar button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.6rem 1rem;font-weight:600;font-size:.9rem;cursor:pointer;transition:filter .15s,transform .05s;}
  .toolbar button:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .toolbar button.secondary{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.1);}
  .status{color:var(--muted);font-size:.85rem;margin-bottom:.75rem;min-height:1.3rem;}
  .tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.75rem;}
  .tags button{background:rgba(114,137,218,.12);color:#c7d0ff;border:1px solid rgba(114,137,218,.25);border-radius:9999px;padding:.2rem .55rem;font-size:.78rem;cursor:pointer;transition:background .15s,border-color .15s;}
  .tags button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .feed{display:grid;gap:.85rem;}
  article{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.05rem 1.2rem;transition:transform .08s ease,border-color .15s ease;}
  article:hover{transform:translateY(-2px);border-color:rgba(114,137,218,.35);}
  article h2{font-size:1.05rem;font-weight:700;margin-bottom:.35rem;line-height:1.25;letter-spacing:-.01em;}
  article h2 a{color:var(--text);text-decoration:none;}
  article h2 a:hover{color:var(--accent);text-decoration:underline;}
  .meta{font-size:.78rem;color:var(--muted);margin-bottom:.55rem;}
  article p{color:#c2c6d6;font-size:.92rem;line-height:1.35;}
  mark{background:rgba(114,137,218,.35);color:#fff;padding:.05rem .15rem;border-radius:3px;font-weight:600;}
  .tag{display:inline-block;padding:.15rem .45rem;border-radius:9999px;font-size:.72rem;background:rgba(114,137,218,.15);color:#93c5fd;margin-top:.6rem;font-weight:600;}
  .empty{color:var(--muted);font-style:italic;padding:1.2rem 0;}
  .pagination{margin-top:1.5rem;text-align:center;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;}
  .pagination button,.pagination a{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.4rem .7rem;text-decoration:none;font-size:.9rem;transition:background .15s,border-color .15s;}
  .pagination button:hover,.pagination a:hover{border-color:var(--accent);color:#fff;}
  .pagination button:disabled{opacity:.35;cursor:default;}
  .pagination strong{margin:0 .2rem;color:var(--accent);font-weight:700;}
  hr{border:0;border-top:1px solid var(--border);margin:1.5rem 0;}
  .skeleton{background:linear-gradient(90deg,var(--surface) 25%,#23242a 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px;padding:1.2rem;height:120px;border:1px solid var(--border);}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @media (max-width:640px){header h1{font-size:1.1rem;} .toolbar input{flex-basis:100%;}}
</style>
</head>
<body>
<header>
  <div class="header-inner" style="align-items:center;gap:1rem;">
    <div>
      <h1>NewsAggregator — Live Global Feed</h1>
      <div class="subtitle">Ported webtool · 60+ international sources · Search / Filter / Export</div>
    </div>
    <div class="toolbar" style="flex:1 1 auto;max-width:640px;margin-left:auto;">
      <input id="searchInput" type="text" placeholder="Search headlines, summaries, sources… (type / Enter)" aria-label="Search" onkeydown="if(event.key==='Enter'){performSearch();}" />
      <button onclick="performSearch()">Search</button>
      <button class="secondary" onclick="clearSearch()">Clear</button>
      <button onclick="fetchArticles()">Refresh</button>
      <button class="secondary" onclick="exportJSON()">Export JSON</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="tags" id="sourceTags" role="region" aria-label="Source filters"></div>

  <section id="feed" class="feed" aria-label="Aggregated feed"></section>
  <div id="status" class="status">Ready — click Refresh to load feeds.</div>
  <div id="pagination" class="pagination" aria-label="Pagination"></div>
</div>

<script>
const RSS_FEEDS = [
  "https://feeds.bbci.co.uk/news/world/rss.xml","https://feeds.bbci.co.uk/news/technology/rss.xml","https://feeds.bbci.co.uk/news/science_and_environment/rss.xml","https://feeds.bbci.co.uk/news/health/rss.xml","https://feeds.bbci.co.uk/news/business/rss.xml","https://feeds.bbci.co.uk/news/politics/rss.xml","https://feeds.bbci.co.uk/news/uk/rss.xml","https://feeds.nbcnews.com/nbcnews/public/news","https://feeds.cbsnews.com/news/cbsnews/world","https://feeds.foxnews.com/foxnews/world","https://edition.cnn.com/services/rss/edition_world.rss","https://feeds.npr.org/1001/rss.xml","https://feeds.reuters.com/reuters/topNews","https://feeds.a.dj.com/rss/RSSWorldNews.xml","https://feeds.feedburner.com/techcrunch/","https://feeds.arstechnica.com/arstechnica/index","https://www.wired.com/feed/rss","https://feeds.bbci.co.uk/news/world/rss.xml","https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/section/world/rss.xml","https://feeds.washingtonpost.com/rss/world","https://globalnews.ca/world/feed/","https://www.buenosairesherald.com/rss","https://www.theguardian.com/world/rss","https://www.france24.com/en/rss","https://www.spiegel.de/international/index.rss","https://www.euronews.com/rss?format=mrss&level=theme&name=news","https://www.independent.co.uk/news/world/rss","https://feeds.dw.com/rdf/rss-en-world","https://www.lemonde.fr/rss/planete.xml","https://elpais.com/rss/cualeser_usa.xml","https://www.si.com/feed/rss/default?category=global&format=xml","https://www.aljazeera.com/xml/rss/all.xml","https://www.japantimes.co.jp/feed/top-stories/","https://www.scmp.com/rss/91/feed","https://timesofindia.indiatimes.com/rssfeeds/296589292.cms","https://mg.co.za/feed/","https://www.dailynewsegypt.com/feed/","https://www.smh.com.au/rss/world.xml","https://feeds.reuters.com/reuters/businessNews","https://feeds.reuters.com/reuters/technologyNews","https://feeds.reuters.com/reuters/scienceNews","https://feeds.reuters.com/reuters/healthNews","https://feeds.feedburner.com/TheEconomist","https://feeds.feedburner.com/ft/world","https://www.chinadaily.com.cn/rss/world.xml","https://www.asahi.com/ajw/rss/","https://www.timesofisrael.com/feed/","https://feed.feedburner.com/africanews/?format=xml"
];

let allArticles=[]; let isSearchActive=false; let currentPage=1; const PER_PAGE=50; let currentTag='';
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function cleanSummary(html){try{return html.replace(/<[^>]+>/g,'').trim();}catch(e){return (html||'').toString();}}

function loadFromJSON(){
  fetch('articles.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
    allArticles=data.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    document.getElementById('status').textContent=`Displaying ${allArticles.length} articles.`;
    document.getElementById('lastLoad').textContent=new Date().toLocaleString();
    buildTags();
    renderPage(allArticles,currentPage);
  }).catch(e=>{document.getElementById('status').textContent='Failed to load articles.json. Refresh to retry.';console.error(e);});
}

function renderPage(articles,page){
  const feed=document.getElementById('feed');
  feed.innerHTML='';
  if(!articles.length){feed.innerHTML='<div class="empty">No articles found.</div>';buildPagination(0,page);return;}
  const start=(page-1)*PER_PAGE;
  const slice=articles.slice(start,start+PER_PAGE);
  slice.forEach(a=>{
    const art=document.createElement('article');
    art.innerHTML=`<h2><a href="${escapeHtml(a.link)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></h2>
      <div class="meta">Source: ${escapeHtml(a.source)} — ${escapeHtml(a.date||'No date')}</div>
      <p>${escapeHtml(a.summary)}</p>`;
    feed.appendChild(art);
  });
  buildPagination(articles.length,page);
}
function render(articles){currentPage=1;renderPage(articles,currentPage);currentTag='';}
function buildPagination(total,page){
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  let html='<div style="margin-top:1.5rem;text-align:center;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;">';
  html+=`<button onclick="goPage(${page-1})" ${page<=1?'disabled style="opacity:.35;cursor:default;"':''}>Previous</button>`;
  for(let i=1;i<=pages;i++){if(i===page)html+=`<strong style="margin:0 .25rem;color:var(--accent);">${i}</strong>`;else html+=`<a href="#" onclick="goPage(${i});return false;" style="margin:0 .25rem;color:var(--accent);text-decoration:none;">${i}</a>`;}
  html+=`<button onclick="goPage(${page+1})" ${page>=pages?'disabled style="opacity:.35;cursor:default;"':''}>Next</button></div>`;
  document.getElementById('pagination').innerHTML=html;
}
function goPage(n){
  const list = currentTag ? allArticles.filter(a=>a.source&&a.source.toLowerCase().includes(currentTag.toLowerCase())) : (isSearchActive ? allArticles.filter(a=>{const q=document.getElementById('searchInput').value.trim().toLowerCase();return (a.title||'').toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)||(a.source||'').toLowerCase().includes(q);}) : allArticles);
  const pages=Math.max(1,Math.ceil(list.length/PER_PAGE));
  if(n<1||n>pages)return;
  currentPage=n;
  renderPage(list,currentPage);
  document.getElementById('feed').scrollIntoView({behavior:'smooth',block:'start'});
}
function performSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){clearSearch();return;}
  isSearchActive=true;currentTag='';
  const filtered=allArticles.filter(a=>(a.title||'').toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)||(a.source||'').toLowerCase().includes(q));
  document.getElementById('status').textContent=`Search: ${filtered.length} results for "${q}"`;
  currentPage=1;renderPage(filtered,currentPage);
}
function clearSearch(){isSearchActive=false;currentTag='';document.getElementById('searchInput').value='';document.getElementById('status').textContent=`Displaying ${allArticles.length} articles.`;currentPage=1;renderPage(allArticles,currentPage);buildTags();}
function buildTags(){
  const tags=document.getElementById('sourceTags');
  const sources=[...new Set(allArticles.map(a=>a.source).filter(Boolean))].sort();
  let html='<button onclick="setTag(\'\')" class="'+(!currentTag?'active':'')+'">All</button>';
  sources.slice(0,12).forEach(s=>{const label=s.replace(/^https?:\/\/[^/]+\//,'').slice(0,22);html+='<button onclick="setTag(\''+escapeHtml(s).replace(/'/g,"\\'")+'\')" class="'+(currentTag===s?'active':'')+'">'+escapeHtml(label)+'</button>';});
  tags.innerHTML=html;
}
function setTag(s){currentTag=s;isSearchActive=false;document.getElementById('searchInput').value='';document.getElementById('status').textContent=`Filter: ${s?escapeHtml(s):'All sources'} (${(currentTag?allArticles.filter(a=>a.source&&a.source.toLowerCase().includes(currentTag.toLowerCase())):allArticles).length} articles)`;currentPage=1;renderPage(currentTag?allArticles.filter(a=>a.source&&a.source.toLowerCase().includes(currentTag.toLowerCase())):allArticles,currentPage);buildTags();}
function fetchArticles(){
  document.getElementById('status').textContent='Fetching news, please wait…';
  document.getElementById('feed').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  document.getElementById('pagination').innerHTML='';
  allArticles=[];isSearchActive=false;currentTag='';currentPage=1;document.getElementById('searchInput').value='';
  loadFromJSON();
}
function exportJSON(){const payload={exportedAt:new Date().toISOString(),articles:allArticles};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='newsaggregator-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
</script>
<script>document.addEventListener('DOMContentLoaded',()=>{fetchArticles();document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){performSearch();}});});</script>
</body>
</html>
